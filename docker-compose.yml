services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: minibank-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak-database
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: 8080
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://keycloak:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: minibank-database,keycloak-database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: minibank:0.5.0
    restart: always
    ports:
      - "8082:8082"
    environment:
      # R2DBC Configuration
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/minibank-database?currentSchema=bank
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_R2DBC_POOL_INITIAL_SIZE: 5
      SPRING_R2DBC_POOL_MAX_SIZE: 10
      SPRING_R2DBC_POOL_MAX_IDLE_TIME: 30m
      SPRING_R2DBC_POOL_VALIDATION_QUERY: "SELECT 1"

      # Liquibase Configuration
      SPRING_LIQUIBASE_URL: jdbc:postgresql://postgres:5432/minibank-database
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres
      SPRING_LIQUIBASE_DEFAULT_SCHEMA: bank
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yaml

      # Application Configuration
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      SPRING_APPLICATION_NAME: minibank

      # Jackson Configuration
      SPRING_JACKSON_DESERIALIZATION_FAIL_ON_UNKNOWN_PROPERTIES: false

      # Logging Configuration
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_CZ_EMEMSOFT_MINIBANK: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_R2DBC: INFO
      LOGGING_LEVEL_IO_R2DBC_POSTGRESQL: INFO

      # Task Execution Configuration
      SPRING_TASK_EXECUTION_POOL_CORE_SIZE: 5
      SPRING_TASK_EXECUTION_POOL_MAX_SIZE: 10
      SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY: 25
      SPRING_TASK_EXECUTION_THREAD_NAME_PREFIX: "AsyncExecutor-"

      # OAuth2 Configuration (using keycloak service name for internal communication)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/minibank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/minibank/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: minibank
      KEYCLOAK_CLIENT_ID: minibank-api
      KEYCLOAK_CLIENT_SECRET: minibank-secret
      KEYCLOAK_ADMIN_REALM: master

      # Management/Actuator Configuration
#      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
#      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always

    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
