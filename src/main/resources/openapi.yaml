openapi: 3.0.3
info:
  title: Minibank API
  description: |
    A reactive banking system API built with Spring Boot 3.4.1, Kotlin, and R2DBC.
    
    ## Features
    - Client management with full CRUD operations
    - Bank account management with multiple account types
    - Secure money transfers between accounts
    - Transaction history and reporting
    - Real-time balance updates
    - Multi-currency support (USD, EUR, GBP)
    - Money-safe operations with 4-decimal precision
    - Enum-based ordinal storage for account types and currencies
    
    ## Money Safety
    All monetary operations use BigDecimal with 4-decimal precision and banker's rounding (HALF_EVEN).
    Transaction limits: 0.0001 to 999,999,999,999,999.9999 per currency.
    
    ## Storage Architecture
    - Account types and currencies stored as ordinal integers for performance
    - Reactive R2DBC for non-blocking database operations
    - PostgreSQL with schema-based organization
  version: 0.5.0
  contact:
    name: EMeMSoft spol. s r.o.
    email: support@ememsoft.cz
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8082
    description: Development server

tags:
  - name: clients
    description: Client management operations
  - name: accounts
    description: Bank account management
  - name: transactions
    description: Money transfer and transaction operations

paths:
  /clients:
    get:
      tags: [clients]
      summary: Get all clients
      operationId: getAllClients
      responses:
        '200':
          description: List of clients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [clients]
      summary: Create a new client
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Client with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /clients/{id}:
    get:
      tags: [clients]
      summary: Get client by ID
      operationId: getClientById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [clients]
      summary: Update an existing client
      operationId: updateClient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientDto'
      responses:
        '200':
          description: Client updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [clients]
      summary: Delete a client
      operationId: deleteClient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Client deleted successfully
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /clients/search-by-name/{firstName}:
    get:
      tags: [clients]
      summary: Search clients by first name
      operationId: findClientsByFirstName
      parameters:
        - name: firstName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clients found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /clients/search-by-email/{email}:
    get:
      tags: [clients]
      summary: Search client by email
      operationId: findClientByEmail
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Client found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDto'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts:
    get:
      tags: [accounts]
      summary: Get all accounts
      operationId: getAllAccounts
      responses:
        '200':
          description: List of accounts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [accounts]
      summary: Create a new account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/{id}:
    get:
      tags: [accounts]
      summary: Get account by ID
      operationId: getAccountById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [accounts]
      summary: Update an account
      operationId: updateAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDto'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [accounts]
      summary: Delete an account
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Account deleted successfully
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /accounts/client/{clientId}:
    get:
      tags: [accounts]
      summary: Get accounts by client ID
      operationId: getAccountsByClientId
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Client accounts found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDto'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/transfer:
    post:
      tags: [transactions]
      summary: Transfer money between accounts
      description: |
        Performs a money transfer between two accounts with validations:
        - Both accounts must exist and have matching currencies
        - Source account must have sufficient funds
        - Amount must be between 0.0001 and 999,999,999,999,999.9999
        - Accounts must be different
      operationId: transferMoney
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '201':
          description: Transfer completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Invalid transfer request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InsufficientFundsError'
                  - $ref: '#/components/schemas/CurrencyMismatchError'
                  - $ref: '#/components/schemas/InvalidAmountError'
                  - $ref: '#/components/schemas/SameAccountError'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/{id}:
    get:
      tags: [transactions]
      summary: Get transaction by ID
      operationId: getTransactionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/account/{accountId}:
    get:
      tags: [transactions]
      summary: Get all transactions for an account
      operationId: getTransactionsByAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/account/{accountId}/outgoing:
    get:
      tags: [transactions]
      summary: Get outgoing transactions for an account
      operationId: getOutgoingTransactions
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Outgoing transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /transactions/account/{accountId}/incoming:
    get:
      tags: [transactions]
      summary: Get incoming transactions for an account
      operationId: getIncomingTransactions
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Incoming transactions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ClientDto:
      type: object
      required: [id, firstName, lastName, email, personalNumber]
      properties:
        id:
          type: integer
          format: int64
          description: Unique client identifier
        firstName:
          type: string
          description: Client's first name
          maxLength: 255
        lastName:
          type: string
          description: Client's last name
          maxLength: 255
        email:
          type: string
          format: email
          description: Client's email address (must be unique)
          maxLength: 255
        phoneNumber:
          type: string
          description: Client's phone number
          pattern: '^\+?[1-9]\d{1,14}$'
          nullable: true
        address:
          type: string
          description: Client's address
          nullable: true
        dateOfBirth:
          type: string
          format: date
          description: Client's date of birth
          nullable: true
        personalNumber:
          type: string
          format: uuid
          description: Unique personal identifier (UUID)

    CreateClientRequest:
      type: object
      required: [firstName, lastName, email, phoneNumber, address, dateOfBirth]
      properties:
        firstName:
          type: string
          description: Client's first name
          maxLength: 255
        lastName:
          type: string
          description: Client's last name
          maxLength: 255
        email:
          type: string
          format: email
          description: Client's email address (must be unique)
          maxLength: 255
        phoneNumber:
          type: string
          description: Client's phone number
          maxLength: 255
        address:
          type: string
          description: Client's address
          maxLength: 255
        dateOfBirth:
          type: string
          format: date
          description: Client's date of birth (must be in the past)

    CreateClientResponse:
      allOf:
        - $ref: '#/components/schemas/ClientDto'
      description: Response after successfully creating a client

    AccountDto:
      type: object
      required: [id, name, clientId, balance, accountType, currency]
      properties:
        id:
          type: integer
          format: int64
          description: Unique account identifier
        name:
          type: string
          description: Account name
          maxLength: 255
        clientId:
          type: integer
          format: int64
          description: ID of the account owner
        balance:
          type: string
          description: Current account balance with 4 decimal precision
          pattern: '^\d{1,15}\.\d{4}$'
          example: "1250.5000"
        accountType:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/Currency'

    CreateAccountRequest:
      type: object
      required: [accountType, balance, currency, clientId]
      properties:
        accountType:
          type: string
          description: Account type
          enum: [CHECKING, CURRENT, SAVINGS, INVESTMENT, BUSINESS, STUDENT, JOINT, LOAN, CLASSIC]
        balance:
          type: string
          description: Initial account balance (must be >= 0) with up to 4 decimal places
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          example: "1000.0000"
        currency:
          type: string
          description: Account currency
          enum: [USD, EUR, GBP]
        clientId:
          type: integer
          format: int64
          description: ID of the account owner

    TransactionRequest:
      type: object
      required: [sourceAccountId, targetAccountId, amount, currency]
      properties:
        sourceAccountId:
          type: integer
          format: int64
          description: ID of the account to transfer from
        targetAccountId:
          type: integer
          format: int64
          description: ID of the account to transfer to
        amount:
          type: string
          description: Amount to transfer (0.0001 to 999,999,999,999,999.9999)
          pattern: '^\d{1,15}(\.\d{1,4})?$'
          example: "150.0000"
        currency:
          type: string
          description: Transaction currency
          enum: [USD, EUR, GBP]
        reference:
          type: string
          description: Optional transfer reference or description
          maxLength: 255
          default: ""

    TransactionResponse:
      type: object
      required: [id, sourceAccountId, targetAccountId, amount, currency, timestamp, status, reference]
      properties:
        id:
          type: integer
          format: int64
          description: Unique transaction identifier
        sourceAccountId:
          type: integer
          format: int64
          description: ID of the source account
        targetAccountId:
          type: integer
          format: int64
          description: ID of the target account
        amount:
          type: string
          description: Transfer amount with 4 decimal precision
          example: "150.0000"
        currency:
          type: string
          description: Transaction currency
          enum: [USD, EUR, GBP]
        timestamp:
          type: string
          format: date-time
          description: When the transaction occurred
        status:
          $ref: '#/components/schemas/TransactionStatus'
        reference:
          type: string
          description: Transfer reference or description

    AccountType:
      type: string
      enum: [CHECKING, CURRENT, SAVINGS, INVESTMENT, BUSINESS, STUDENT, JOINT, LOAN, CLASSIC]
      description: Type of bank account

    Currency:
      type: string
      enum: [USD, EUR, GBP]
      description: ISO 4217 currency code (3-letter)

    TransactionStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]
      description: Current status of the transaction

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error description

    InsufficientFundsError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        error: "Insufficient Funds"
        message: "Insufficient funds in account 1. Available: 100.00 USD, Required: 150.00 USD"

    CurrencyMismatchError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        error: "Currency Mismatch"
        message: "Currency mismatch: source account has USD, but transfer requests EUR"

    InvalidAmountError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        error: "Invalid Transaction Amount"
        message: "Amount must be positive and at least 0.0001"

    SameAccountError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        error: "Invalid Transfer"
        message: "Source and target account IDs must be different"

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ClientNotFound:
      description: Client not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Client Not Found"
            message: "Client with ID 123 not found"

    AccountNotFound:
      description: Account not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Account Not Found"
            message: "Account with ID 456 not found"

    TransactionNotFound:
      description: Transaction not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Transaction Not Found"
            message: "Transaction with ID 789 not found"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Internal Server Error"
            message: "An unexpected error occurred"