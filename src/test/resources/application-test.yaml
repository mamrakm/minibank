spring:
  application:
    name: minibank-test
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: bank
    # Enable Liquibase for test environment
    enabled: true
  r2dbc:
    pool:
      initial-size: 1
      max-size: 2
      max-idle-time: 30m
  security:
    oauth2:
      resourceserver:
        jwt:
          # Disable OAuth2 for tests
          issuer-uri: http://disabled-for-tests
          # Mock JWK set for tests
          jwk-set-uri: http://disabled-for-tests/jwks
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 10
        allow-core-thread-timeout: true
      thread-name-prefix: "TestAsyncExecutor-"

server:
  port: 0  # Use a random port for tests to avoid conflicts

logging:
  level:
    root: INFO
    cz.ememsoft.minibank: INFO
    org.springframework.r2dbc: DEBUG
    org.springframework.transaction: INFO
    r2dbc.postgresql: INFO
    r2dbc.pool: INFO
    org.testcontainers: INFO
    reactor.netty: INFO
    io.r2dbc.postgresql: INFO
    liquibase: INFO

# Test-specific settings for Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
